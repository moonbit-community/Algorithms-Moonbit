name: check

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        version: [latest, nightly]
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Moonbit
        uses: hustcer/setup-moonbit@develop
        with:
          version: ${{ matrix.version }}

      - name: Check Moonbit Version
        run: |
          moon version --all

      - name: Setup MSVC
        if: ${{ runner.os == 'Windows' }}
        uses: ilammy/msvc-dev-cmd@v1

      - name: moon check
        run: moon check --deny-warn --target all

      - name: format diff
        run: |
          moon fmt
          git diff --exit-code

      - name: moon test
        run: |
          moon test --target all

      - name: moon bench
        run: |
          moon bench

  nested-sorts:
    strategy:
      fail-fast: false
      matrix:
        version: [latest, nightly]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hustcer/setup-moonbit@develop
        with:
          version: ${{ matrix.version }}
      - name: Check and test nested sorting modules
        shell: bash
        run: |
          set -e
          for module in sort/Introsort sort/selection_sort sort/shell_sort; do
            (
              cd "$module"
              moon check --deny-warn --target all
              moon fmt --check
              moon info --target all
              git diff --exit-code
              moon test --target all
            )
          done
